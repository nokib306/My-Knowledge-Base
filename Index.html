<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knowledge Base</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05060a;
        --panel: #10131b;
        --panel-dark: #0a0c12;
        --border: #1e2130;
        --accent: #6a5acd;
        --accent-strong: #8f7bff;
        --text: #f6f7fb;
        --muted: #b5bad4;
        --danger: #ff5f87;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: radial-gradient(circle at top, rgba(106, 90, 205, 0.2), transparent 50%), var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 32px 12px;
      }

      .app {
        width: min(1100px, 100%);
        background: linear-gradient(145deg, rgba(19, 22, 34, 0.95), rgba(6, 7, 10, 0.95));
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 4px;
        font-size: clamp(28px, 4vw, 36px);
        letter-spacing: 0.02em;
      }

      .subtitle {
        margin: 0 0 32px;
        color: var(--muted);
        font-size: 15px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      select,
      textarea,
      input[type='text'] {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        color: var(--text);
        font-size: 15px;
        transition: border 0.2s ease, box-shadow 0.2s ease;
      }

      textarea {
        min-height: 150px;
        resize: vertical;
      }

      select:focus,
      textarea:focus,
      input[type='text']:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(138, 105, 255, 0.2);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 12px 0 32px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 22px;
        font-size: 15px;
        letter-spacing: 0.03em;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #fff;
        box-shadow: 0 12px 24px rgba(106, 90, 205, 0.35);
      }

      button.secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
      }

      button.danger {
        background: rgba(255, 95, 135, 0.15);
        border: 1px solid rgba(255, 95, 135, 0.4);
        color: var(--danger);
      }

      button:active {
        transform: translateY(1px);
        box-shadow: none;
      }

      .search-bar {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
      }

      .search-bar input {
        width: 100%;
      }

      .entries {
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        background: var(--panel-dark);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead {
        background: rgba(255, 255, 255, 0.03);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        font-size: 12px;
        color: var(--muted);
      }

      th,
      td {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        vertical-align: top;
      }

      tbody tr:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .empty-state {
        text-align: center;
        padding: 32px;
        color: var(--muted);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 12px;
        letter-spacing: 0.03em;
      }

      .content-cell {
        white-space: pre-wrap;
      }

      .status {
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
      }

      @media (max-width: 680px) {
        .app {
          padding: 24px;
        }

        th:nth-child(2),
        td:nth-child(2) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Knowledge Base</h1>
      <p class="subtitle">Save text, links, ideas, snippets, and more with instant search + edit + delete.</p>

      <div class="form-grid">
        <div>
          <label for="category">Category</label>
          <select id="category"></select>
        </div>
        <div>
          <label for="entry-id">Entry ID</label>
          <input id="entry-id" type="text" placeholder="Auto generated" disabled />
        </div>
      </div>

      <label for="content">Content</label>
      <textarea id="content" placeholder="Type anything you want to remember..."></textarea>

      <div class="actions">
        <button class="primary" id="save-btn">Save Entry</button>
        <button class="secondary" id="clear-btn">Clear</button>
        <div class="status" id="status"></div>
      </div>

      <div class="search-bar">
        <label for="search">Search</label>
        <input id="search" type="text" placeholder="Search by keyword, category, ID..." />
      </div>

      <div class="entries" id="entries"></div>
    </div>

    <script>
      const categorySelect = document.getElementById('category');
      const contentInput = document.getElementById('content');
      const idInput = document.getElementById('entry-id');
      const entriesContainer = document.getElementById('entries');
      const searchInput = document.getElementById('search');
      const statusEl = document.getElementById('status');

      let entries = [];
      let categoriesLoaded = false;

      document.getElementById('save-btn').addEventListener('click', saveCurrentEntry);
      document.getElementById('clear-btn').addEventListener('click', clearForm);
      searchInput.addEventListener('input', debounce(() => fetchEntries(searchInput.value.trim()), 250));

      document.addEventListener('DOMContentLoaded', () => {
        fetchCategories();
        fetchEntries();
      });

      function setStatus(message, timeout = 2000) {
        statusEl.textContent = message || '';
        if (message) {
          setTimeout(() => {
            statusEl.textContent = '';
          }, timeout);
        }
      }

      function fetchCategories() {
        if (categoriesLoaded) return;
        google.script.run
          .withSuccessHandler(list => {
            categorySelect.innerHTML = list
              .map(cat => `<option value="${cat}">${cat}</option>`)
              .join('');
            categoriesLoaded = true;
          })
          .withFailureHandler(err => setStatus(err.message || 'Failed to load categories'))
          .getCategories();
      }

      function fetchEntries(searchTerm = '') {
        google.script.run
          .withSuccessHandler(data => {
            entries = data;
            renderEntries();
          })
          .withFailureHandler(err => setStatus(err.message || 'Failed to load entries'))
          .getEntries(searchTerm);
      }

      function renderEntries() {
        if (!entries.length) {
          entriesContainer.innerHTML = '<div class="empty-state">No entries yet. Save something!</div>';
          return;
        }

        const rows = entries
          .map(
            entry => `
              <tr>
                <td>
                  <div>${entry.date}</div>
                  <small>${entry.time}</small>
                </td>
                <td><span class="chip">${entry.category}</span></td>
                <td class="content-cell">${escapeHtml(entry.content)}</td>
                <td>
                  <code>${entry.id}</code>
                  <div style="margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="secondary" style="padding: 6px 12px; font-size: 12px;" onclick="editEntry('${entry.id}')">Edit</button>
                    <button class="danger" style="padding: 6px 12px; font-size: 12px;" onclick="confirmDelete('${entry.id}')">Delete</button>
                  </div>
                </td>
              </tr>
            `
          )
          .join('');

        entriesContainer.innerHTML = `
          <table>
            <thead>
              <tr>
                <th style="width: 140px">Saved</th>
                <th style="width: 120px">Category</th>
                <th>Content</th>
                <th style="width: 160px">Actions</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      function editEntry(id) {
        const entry = entries.find(item => item.id === id);
        if (!entry) return;
        idInput.value = entry.id;
        categorySelect.value = entry.category;
        contentInput.value = entry.content;
        contentInput.focus();
        setStatus('Editing entry...');
      }

      function confirmDelete(id) {
        if (!confirm('Delete this entry?')) return;
        google.script.run
          .withSuccessHandler(() => {
            setStatus('Entry deleted');
            fetchEntries(searchInput.value.trim());
            if (idInput.value === id) {
              clearForm();
            }
          })
          .withFailureHandler(err => setStatus(err.message || 'Failed to delete entry'))
          .deleteEntry(id);
      }

      function clearForm() {
        idInput.value = '';
        contentInput.value = '';
        categorySelect.selectedIndex = 0;
        setStatus('Form cleared');
      }

      function saveCurrentEntry() {
        const payload = {
          id: idInput.value.trim(),
          category: categorySelect.value,
          content: contentInput.value.trim()
        };

        if (!payload.content) {
          setStatus('Content is required');
          contentInput.focus();
          return;
        }

        google.script.run
          .withSuccessHandler(id => {
            setStatus(payload.id ? 'Entry updated' : 'Entry saved');
            idInput.value = id;
            fetchEntries(searchInput.value.trim());
            if (!payload.id) {
              contentInput.value = '';
            }
          })
          .withFailureHandler(err => setStatus(err.message || 'Failed to save entry'))
          .saveEntry(payload);
      }

      function debounce(fn, delay) {
        let timer;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => fn.apply(this, args), delay);
        };
      }

      function escapeHtml(str) {
        return (str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
    </script>
  </body>
</html>
